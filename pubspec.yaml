name: kupon_office_admin
description: KupON Admin — painel de administração
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  supabase_flutter: ^2.3.0
  flutter_dotenv: ^5.1.0
  go_router: ^14.8.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.2
  fl_chart: ^0.70.2
  lottie: ^3.4.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  pdf: ^3.13.0
  printing: ^5.15.0
  csv: ^8.0.0
  path_provider: ^2.1.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/svg/
